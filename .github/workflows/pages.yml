name: Docs Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - '.github/scripts/check-docs.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  windows-preview:
    name: Windows shell evidence
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current FedoraWin development source
        uses: actions/checkout@v5
        with:
          ref: develop

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python test dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest

      - name: Safety, structure and regression suite
        shell: pwsh
        run: python -m pytest -q

      - name: Compile repo-native bridge
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -Path 'native/FedoraWinNativeUi.cs'
          if (-not ('FedoraWinDwmFrameManager' -as [type])) { throw 'DWM frame manager type missing' }
          if (-not ('FedoraWinAppBar' -as [type])) { throw 'AppBar type missing' }
          if (-not ('FedoraWinPowerMode' -as [type])) { throw 'Power mode type missing' }

      - name: Installed-app catalog smoke
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests\app-catalog-smoke.ps1

      - name: Windows PowerShell 5.1 and WPF smoke
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -STA -File tests\windows-smoke.ps1

      - name: Build FedoraWin executable package
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests\build-exe.ps1

      - name: Capture real FedoraWin.exe UI surfaces
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -STA -File tests\capture-site-preview.ps1

      - name: Upload Windows-rendered site evidence
        uses: actions/upload-artifact@v4
        with:
          name: pages-windows-preview
          path: |
            artifacts/site-preview/*.png
            artifacts/site-preview/preview-metadata.json
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy verified docs
    needs: windows-preview
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v5

      - name: Download Windows-rendered evidence
        uses: actions/download-artifact@v5
        with:
          name: pages-windows-preview
          path: docs/assets/runtime

      - name: Validate static docs
        run: python .github/scripts/check-docs.py

      - name: Verify Windows evidence payload
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/assets/runtime/preview-metadata.json
          test -s docs/assets/runtime/activities-overview.png
          test -s docs/assets/runtime/applications-grid.png
          test -s docs/assets/runtime/quick-settings-dark.png
          test -s docs/assets/runtime/quick-settings-light.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
