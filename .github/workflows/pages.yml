name: Docs Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - '.github/scripts/check-docs.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  windows-preview:
    name: Current FedoraWin.exe gallery evidence
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      FEDORAWIN_SOURCE_BRANCH: dev/gnome-native-20260914
    steps:
      - name: Checkout current native FedoraWin source
        uses: actions/checkout@v5
        with:
          ref: dev/gnome-native-20260914

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: UI/native contracts
        run: node --test tests/ui_contract.test.mjs

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Rust format gate
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Build current FedoraWin.exe
        working-directory: src-tauri
        run: cargo build

      - name: Capture real Tauri shell surfaces
        shell: pwsh
        run: ./tests/capture-site-preview.ps1

      - name: Upload Windows-rendered gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-windows-preview
          path: |
            artifacts/site-preview/*.png
            artifacts/site-preview/preview-metadata.json
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy verified docs
    needs: windows-preview
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v5

      - name: Download Windows-rendered evidence
        uses: actions/download-artifact@v5
        with:
          name: pages-windows-preview
          path: docs/assets/runtime

      - name: Validate static docs
        run: python .github/scripts/check-docs.py

      - name: Verify runtime gallery payload
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/assets/runtime/preview-metadata.json
          test -s docs/assets/runtime/panel.png
          test -s docs/assets/runtime/activities.png
          test -s docs/assets/runtime/apps.png
          test -s docs/assets/runtime/search_terminal.png
          test -s docs/assets/runtime/quick_settings_dark.png
          test -s docs/assets/runtime/quick_settings_light.png
          test -s docs/assets/runtime/appearance.png
          test -s docs/assets/runtime/date_menu.png
          test -s docs/assets/runtime/native_frame.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
