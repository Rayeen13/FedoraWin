name: Hydrate FedoraWin source

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/hydrate-source.yml'

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Reconstitute verified source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/hydrate-bundle/part-00 .ci/hydrate-bundle/part-01 .ci/hydrate-bundle/part-02 .ci/hydrate-bundle/part-03a .ci/hydrate-bundle/part-03b .ci/hydrate-bundle/part-04 | base64 -d > /tmp/hydrate_bundle.tar.gz
          echo 'b9dedb7c401f62a4f2d0c752bceb860a833c0d3a464fc0e543f4359df4eb8adc  /tmp/hydrate_bundle.tar.gz' | sha256sum -c -
          tar -xzf /tmp/hydrate_bundle.tar.gz -C .

      - name: Static regression tests before commit
        shell: bash
        run: python -m pytest -q

      - name: Commit hydrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FedoraWin Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add FedoraWin.ps1 CHANGELOG.md TESTING.md Disable-Startup.cmd Enable-Startup.cmd Install-Startup.ps1 Remove-Startup.ps1 Open-Log.cmd Preflight.cmd Preflight.ps1 Restore-Windows.cmd Restore-Windows.ps1 Safe-Preview.cmd Start-FedoraWin.cmd ui/Activities.xaml ui/Appearance.xaml ui/Calendar.xaml ui/Panel.xaml ui/PowerMenu.xaml tests/test_safety.py tests/test_structure.py tests/test_regressions.py
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'feat(shell): restore tracked GNOME shell source'
            git push origin HEAD:develop
          fi
