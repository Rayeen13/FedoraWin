name: Retire FedoraWin hydration bootstrap

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/hydrate-source.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Remove one-time hydration artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FedoraWin Automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .ci/FedoraWin-worktree.tar.gz
          git rm -rf .ci/hydrate-bundle
          git rm -f .github/workflows/hydrate-source.yml
          git commit -m 'chore(ci): remove obsolete bootstrap snapshot artifacts'
          git push origin HEAD:develop
