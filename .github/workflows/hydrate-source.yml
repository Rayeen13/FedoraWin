name: Hydrate FedoraWin source

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/hydrate-source.yml'

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Verify archived working snapshot
        shell: bash
        run: |
          set -euo pipefail
          echo '579c78aec047d04909c6f0f46b22d18dce97cc3b98f37ae69b536a908c4d7c46  .ci/FedoraWin-worktree.tar.gz' | sha256sum -c -
          rm -rf _hydrate
          mkdir _hydrate
          tar -xzf .ci/FedoraWin-worktree.tar.gz -C _hydrate

      - name: Promote working shell source into repository
        shell: bash
        run: |
          set -euo pipefail
          for f in FedoraWin.ps1 CHANGELOG.md TESTING.md Disable-Startup.cmd Enable-Startup.cmd Install-Startup.ps1 Remove-Startup.ps1 Open-Log.cmd Preflight.cmd Preflight.ps1 Restore-Windows.cmd Restore-Windows.ps1 Safe-Preview.cmd Start-FedoraWin.cmd ui/Activities.xaml ui/Appearance.xaml ui/Calendar.xaml ui/Panel.xaml ui/PowerMenu.xaml tests/test_safety.py tests/test_structure.py; do
            mkdir -p "$(dirname "$f")"
            cp "_hydrate/$f" "$f"
          done

      - name: Apply GNOME shell integration patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '...TRUNCATED_BASE64_FOR_TOOL_SAFETY...' | base64 -d > /tmp/fedorawin.patch
          git apply /tmp/fedorawin.patch

      - name: Static regression tests before commit
        shell: bash
        run: python -m pytest -q

      - name: Commit hydrated source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _hydrate
          git config user.name 'FedoraWin Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add FedoraWin.ps1 CHANGELOG.md TESTING.md Disable-Startup.cmd Enable-Startup.cmd Install-Startup.ps1 Remove-Startup.ps1 Open-Log.cmd Preflight.cmd Preflight.ps1 Restore-Windows.cmd Restore-Windows.ps1 Safe-Preview.cmd Start-FedoraWin.cmd ui tests/test_safety.py tests/test_structure.py tests/test_regressions.py
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'feat(shell): restore tracked GNOME shell source'
            git push origin HEAD:develop
          fi
