name: Windows CI

on:
  push:
    branches: [main, feat/gnome-shell-native]
  pull_request:

jobs:
  native-shell:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: UI contract tests
        run: node --test tests/ui_contract.test.mjs
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test
      - name: Rust compile check
        working-directory: src-tauri
        run: cargo check
      - name: Build memory smoke binary
        working-directory: src-tauri
        run: cargo build --release
      - name: FedoraWin memory budget
        shell: pwsh
        run: ./tests/check-memory-budget.ps1
      - name: Upload memory budget
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fedorawin-memory-budget
          path: memory-budget.json
          if-no-files-found: warn
          retention-days: 14
      - name: Rust format check
        if: always()
        working-directory: src-tauri
        run: cargo fmt --all -- --check
