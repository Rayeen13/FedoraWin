name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 native and WPF smoke
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File tests\windows-smoke.ps1
