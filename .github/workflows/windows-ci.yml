name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and expand working snapshot
        shell: pwsh
        run: |
          $expected = '0a0755d3541f1048bc783ea930aa6b6c2e418b53424682e461e407dacc9bb4dc'
          $actual = (Get-FileHash -Algorithm SHA256 '.ci/FedoraWin-worktree.tar.gz').Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Snapshot hash mismatch: $actual" }
          New-Item -ItemType Directory -Force '_snapshot' | Out-Null
          tar -xzf '.ci/FedoraWin-worktree.tar.gz' -C '_snapshot'
      - name: Python safety and regression suite
        shell: pwsh
        working-directory: _snapshot
        run: python -m pytest -q
      - name: Windows PowerShell 5.1 and WPF smoke
        shell: cmd
        working-directory: _snapshot
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File tests\windows-smoke.ps1
