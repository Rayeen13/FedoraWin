name: Windows CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python test dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest

      - name: Python safety, structure and regression suite
        shell: pwsh
        run: python -m pytest -q

      - name: Compile repo-native bridge
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -Path 'native/FedoraWinNativeUi.cs'
          if (-not ('FedoraWinDwmFrameManager' -as [type])) { throw 'DWM frame manager type missing' }
          if (-not ('FedoraWinAppBar' -as [type])) { throw 'AppBar type missing' }
          if (-not ('FedoraWinPowerMode' -as [type])) { throw 'Power mode type missing' }

      - name: Installed-app catalog smoke
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests\app-catalog-smoke.ps1

      - name: Windows PowerShell 5.1 and WPF smoke
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -STA -File tests\windows-smoke.ps1
