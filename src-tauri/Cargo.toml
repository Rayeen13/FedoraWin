[package]
name = "fedorawin"
version = "0.4.0-dev"
description = "Fedora Workstation / GNOME shell experience for Windows 11"
authors = ["Rayeen13"]
edition = "2021"
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Devices_Radios", "Foundation_Collections"] }
wmi = "0.18.4"

[features]
default = []

