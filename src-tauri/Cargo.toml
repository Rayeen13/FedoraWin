[package]
name = "fedorawin"
version = "0.4.0-dev"
description = "Fedora Workstation / GNOME shell experience for Windows 11"
authors = ["Rayeen13"]
edition = "2021"
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"


[features]
default = []

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
